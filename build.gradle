plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
    group = 'com.cryptoautotrader'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.36'
        annotationProcessor 'org.projectlombok:lombok:1.18.36'

        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testImplementation 'org.assertj:assertj-core:3.25.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    test {
        useJUnitPlatform()
        // 🔴 2026-10-13: 기본 512MB 에서 web-api 전체 실행이 **힙 고갈로 멈췄다**(523/524MB, GC 로 CPU 18분,
        //    40분 무응답). 목·스파이 조합마다 캐시되는 스프링 컨텍스트(각자 Tomcat·스케줄러)가 20여 개다.
        //    멈춤 대신 실패로 드러나도록 메모리 부족 시 즉시 종료한다. 아래 측정용 러너는 자기 값을 다시 정한다.
        maxHeapSize = '1g'
        jvmArgs '-XX:+ExitOnOutOfMemoryError'
        // 임시 백테스트 러너 활성화용: -Dha.backtest.csv 가 주어졌을 때만 테스트 JVM으로 전달
        if (System.getProperty('ha.backtest.csv')) {
            systemProperty 'ha.backtest.csv', System.getProperty('ha.backtest.csv')
            testLogging.showStandardStreams = true
        }
        // 전략 검토 A/B 백테스트 러너: -Dreview.backtest.dir=<H1 CSV 디렉터리>
        if (System.getProperty('review.backtest.dir')) {
            systemProperty 'review.backtest.dir', System.getProperty('review.backtest.dir')
            testLogging.showStandardStreams = true
        }
        // Supertrend 확인 필터 게이트 측정: -Dstfilter.dir=<H1 CSV 디렉터리>
        // docs/SUPERTREND_FILTER_PREREG.md v2 §4.5
        if (System.getProperty('stfilter.dir')) {
            systemProperty 'stfilter.dir', System.getProperty('stfilter.dir')
            if (System.getProperty('stfilter.csv')) {
                systemProperty 'stfilter.csv', System.getProperty('stfilter.csv')
            }
            testLogging.showStandardStreams = true
            maxHeapSize = '2g'
        }
        // Supertrend 22코인 일반화 검사: -Dstval.dir=<H1 CSV> [-Dstval.out=] [-Dstval.verify=<coin>]
        if (System.getProperty('stval.dir')) {
            systemProperty 'stval.dir', System.getProperty('stval.dir')
            ['stval.out', 'stval.verify'].each { k ->
                if (System.getProperty(k)) { systemProperty k, System.getProperty(k) }
            }
            testLogging.showStandardStreams = true
            maxHeapSize = '2g'
        }
        // 새 후보 B WF 로컬 실행(LIVE_READINESS §1 #4): -Dbwf.dir=<H1 CSV> -Dbwf.btc=<BTC CSV> + 청산 규칙 원값 6개
        // #9 1단계 선별: + -Dbwf.strategies=POOL23 (빠뜨리면 B 단일 전략으로 돈다 — 리뷰 14차에서 전달 누락 발견)
        if (System.getProperty('bwf.dir')) {
            ['bwf.dir', 'bwf.btc', 'bwf.out', 'bwf.sl', 'bwf.tpMult', 'bwf.trailing',
             'bwf.trailTpPct', 'bwf.trailSlPct', 'bwf.investPct', 'bwf.strategies', 'bwf.expectStrategyCount'].each { k ->
                if (System.getProperty(k)) { systemProperty k, System.getProperty(k) }
            }
            testLogging.showStandardStreams = true
            maxHeapSize = '2g'
        }
        // #9 D3 호출 경로 비교(가짜 자료): -Dcallpath.out=<CSV 경로>
        if (System.getProperty('callpath.out')) {
            systemProperty 'callpath.out', System.getProperty('callpath.out')
            testLogging.showStandardStreams = true
            maxHeapSize = '2g'
        }
        // 상대 강도 순환 보유 개발 자료 1회 실행(RESEARCH_PROPOSAL_XS_MOMENTUM.md v2): -Dxsm.dir=<H1 CSV> -Dxsm.out=<출력>
        if (System.getProperty('xsm.dir')) {
            ['xsm.dir', 'xsm.out'].each { k ->
                if (System.getProperty(k)) { systemProperty k, System.getProperty(k) }
            }
            testLogging.showStandardStreams = true
            maxHeapSize = '2g'
        }
        // TSMOM 개발 자료 1회 실행(RESEARCH_PROPOSAL_TS_MOMENTUM.md §7 3단계, 리뷰 40차): -Dtsm.mode=run|wire -Dtsm.out=<출력>
        if (System.getProperty('tsm.mode')) {
            ['tsm.mode', 'tsm.out'].each { k ->
                if (System.getProperty(k)) { systemProperty k, System.getProperty(k) }
            }
            testLogging.showStandardStreams = true
            maxHeapSize = '2g'
        }
        // 12월 제한 실거래 시험 DAILY_SMA20 개발 자료 대조(LIMITED_LIVE_TEST_PLAN.md §5-3): -Dsma20.h1=<BTC H1 CSV> -Dsma20.out=<출력 폴더>
        if (System.getProperty('sma20.h1')) {
            ['sma20.h1', 'sma20.out'].each { k ->
                if (System.getProperty(k)) { systemProperty k, System.getProperty(k) }
            }
            testLogging.showStandardStreams = true
            maxHeapSize = '2g'
        }
        // Supertrend Q2 (ON/OFF 운용 비교): -Dstfilter.q2.dir=<H1 CSV 디렉터리>
        if (System.getProperty('stfilter.q2.dir')) {
            systemProperty 'stfilter.q2.dir', System.getProperty('stfilter.q2.dir')
            testLogging.showStandardStreams = true
            maxHeapSize = '2g'
        }
    }
}
