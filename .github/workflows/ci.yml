name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── 백엔드 빌드 & 테스트 ───────────────────────────────
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest

    # 서비스 컨테이너(PostgreSQL·Redis)는 두지 않는다 — 테스트가 쓰지 않는다.
    # H2 인메모리(application-test.yml) + mock RedisTemplate(TestRedisConfig)으로 완결되며,
    # 실제 컨테이너를 띄워 두면 "테스트가 이걸 쓴다"는 오해를 낳아 아래 env 사고가 재발한다.

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build -x test
        working-directory: .

      - name: Run tests
        run: ./gradlew test
        working-directory: .
        env:
          # ⚠️ SPRING_DATASOURCE_* / SPRING_REDIS_* 를 여기서 주입하지 말 것.
          #
          # 테스트는 web-api/src/test/resources/application-test.yml 의 H2 인메모리와
          # TestRedisConfig 의 mock RedisTemplate 으로 완결된다. 환경변수는 yml 보다
          # 우선순위가 높아서, URL 만 PostgreSQL 로 덮이고 driver-class-name 은 H2 로 남는다:
          #
          #   Driver org.h2.Driver claims to not accept jdbcUrl,
          #   jdbc:postgresql://localhost:5432/crypto_trader_test
          #
          # 그 결과 Spring 컨텍스트를 띄우는 모든 통합 테스트가 실패했다.
          # 2026-03-23(env 블록 추가)부터 2026-09-15 까지 backend job 이 계속 red 였고,
          # 로컬 `./gradlew test` 는 통과하기 때문에 드러나지 않았다.
          API_AUTH_TOKEN: ci-test-token
          AES_KEY: test-aes-key-minimum-32-chars-here

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: web-api/build/reports/tests/

  # ─── 프론트엔드 빌드 & 린트 ────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crypto-trader-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: crypto-trader-frontend

      - name: Lint
        run: npm run lint
        working-directory: crypto-trader-frontend

      - name: Build
        run: npm run build
        working-directory: crypto-trader-frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          INTERNAL_BACKEND_URL: http://localhost:8080
          API_TOKEN: ci-test-token
          AUTH_PASSWORD: ci-test-password
          AUTH_SECRET: ci-test-secret-minimum-32-characters

  # ─── E2E (Playwright) ──────────────────────────────────
  # 스펙은 NEXT_PUBLIC_USE_MOCK=true 로 목 API 를 쓰고 playwright.config.ts 의
  # webServer 가 next dev 를 직접 띄우므로, 백엔드·DB 없이 단독으로 돈다.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crypto-trader-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: crypto-trader-frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: crypto-trader-frontend

      - name: Run E2E
        run: npm run test:e2e
        working-directory: crypto-trader-frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: crypto-trader-frontend/playwright-report
          retention-days: 7

  # ─── Docker 이미지 빌드 (main 브랜치 push 시만) ─────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ backend, frontend, e2e ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web-api/Dockerfile
          push: false
          tags: crypto-auto-trader-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./crypto-trader-frontend
          file: ./crypto-trader-frontend/Dockerfile
          push: false
          tags: crypto-auto-trader-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
