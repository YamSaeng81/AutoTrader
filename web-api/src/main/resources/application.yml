spring:
  application:
    name: crypto-auto-trader

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crypto_auto_trader}
    username: ${DB_USERNAME:trader}
    password: ${DB_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # ── 2026-09-26: 잠금 대기가 영구 정지로 번지는 것을 끊는다 ──────────────
      # 사고: 미종료 트랜잭션이 보유한 행 잠금을 다른 트랜잭션이 기다렸고, Postgres 는
      # 잠금 대기에 기본 제한이 없어 **2시간 동안 아무 경고 없이** 멈춰 있었다.
      # MarketDataSyncService 는 fixedDelay 라 그 한 번이 끝나지 않으면 다음 회차가
      # 영구히 없다 → 22코인 캔들 적재가 조용히 중단됐다.
      #
      # 🔴 lock_timeout 이 이 실패에 정확히 대응한다 — 잠금 대기만 끊고 정상 질의는
      #    건드리지 않는다. 초과 시 예외 → 트랜잭션 롤백 → 커넥션 반환 → 다음 회차 진행.
      #    (`connection-timeout` 은 커넥션 **획득** 대기라 이 실패를 막지 못한다.)
      #
      # ⚠️ statement_timeout·socketTimeout 은 **지금 넣지 않는다.** 운영에 2분 40초짜리
      #    무거운 질의가 실재하고(strategy_log 시간별 DISTINCT ON, 병렬 워커 4개),
      #    그 둘은 잠금 대기가 아닌 정상 질의까지 끊는다. 그 질의를 먼저 손본 뒤 별도로
      #    판단한다 — 안전장치를 넣다가 동작하는 기능을 깨지 않는다.
      connection-init-sql: SET lock_timeout = '${DB_LOCK_TIMEOUT:10s}'
      # 누수 감지는 **진단용**이다. 대여 시간이 이 값을 넘으면 Hikari 가 경고와 함께
      # **대여한 스레드의 스택**을 남긴다 — "어느 스레드가 트랜잭션을 쥐고 있었는가"를
      # 사후에 잇는 유일한 수단이다(이번 사고에서 그걸 잇지 못해 추정에 머물렀다).
      # 🔴 대여를 취소하지 않으므로 이것만으로는 정지가 풀리지 않는다. 끊는 것은 lock_timeout 이다.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:60000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:855008981}
  enabled: ${TELEGRAM_ENABLED:true}

discord:
  bot-token: ${DISCORD_BOT_TOKEN:}

upbit:
  access-key: ${UPBIT_ACCESS_KEY:}
  secret-key: ${UPBIT_SECRET_KEY:}

# LLM 시크릿은 .env(ANTHROPIC_API_KEY)로 관리 — DB(llm_provider_config.api_key)보다 우선.
# 비어 있으면 ClaudeProvider가 DB의 api_key로 폴백한다.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

api:
  auth:
    token: ${API_AUTH_TOKEN}

# DB 초기화 확인 비밀번호. 미설정 시 초기화 기능이 완전히 비활성화된다(fail-closed).
db-reset:
  password: ${DB_RESET_PASSWORD:}

# 신호 기대값 검증 게이트 — true로 켜면 Walk Forward에서 out-of-sample 기대값>0을
# 증명하지 못한 전략은 LIVE/DYNAMIC 세션 생성이 차단된다. 기본 false(비활성):
# 대부분의 기존 전략이 아직 Walk Forward 이력이 없어, 기본 on으로 배포하면 신규 세션
# 생성이 전면 중단된다. 켜기 전에 GET /api/v1/strategies/walk-forward-gate-status로
# 어떤 전략이 막히는지 먼저 확인할 것.
strategy-validation:
  require-walk-forward-gate: ${REQUIRE_WALK_FORWARD_GATE:false}

# ── 통제된 전략 비교를 위한 설정 (2026-09-07) ────────────────────────────────
# 운영 DB 실측: 세션마다 워치리스트를 각자의 시계로 만들고 있어 같은 전략끼리도 서로 다른
# 코인을 봤다. 코인·시각을 통제하니 전략 순위가 무너졌다 —
# MTF_CONFIRMED 24h 사후수익 -1.25% → -0.16%, MTF_BTC -0.48% → +1.21%(부호 반전).
# 근거 상세는 SharedUniverseService 및 docs/PROGRESS.md 2026-09-07 항목 참조.
trading:
  shared-universe:
    # 전 세션이 같은 종목 유니버스를 본다. false 면 세션별 워치리스트(이전 동작)로 복귀.
    enabled: ${SHARED_UNIVERSE_ENABLED:true}
    # 유니버스 구성 타임프레임을 강제한다. 비우면 타임프레임별로 1개씩(H1/M15) 생겨
    # 타임프레임 간 비교는 여전히 교란된다. 값을 주면 함대 전체가 단일 유니버스가 된다.
    force-timeframe: ${SHARED_UNIVERSE_TIMEFRAME:H1}
    # 함대 공통 갱신 주기(분). 세션별 watchlist_refresh_min 은 쓰지 않는다 — 운영 함대가
    # 30분/60분 두 그룹으로 갈려 있어 세션 값으로 버킷을 끊으면 같은 순간에도 유니버스가
    # 둘로 쪼개진다(2026-09-07 실측). 공유하려면 버킷이 함대 전체에 하나여야 한다.
    refresh-minutes: ${SHARED_UNIVERSE_REFRESH_MIN:30}
  strategy-signal-exit:
    # 전략 SELL 청산. 기본 off — DYN_PAPER 청산 335건 중 이 경로 110건이 -10,298원으로
    # 적자 전액을 차지했고, 빼면 나머지 합이 +2,609원이다. TP/SL/TIME_STOP 만 사용한다.
    # 신호 자체는 계속 기록되므로(blocked_reason) 반사실 측정은 유지된다.
    enabled: ${STRATEGY_SIGNAL_EXIT_ENABLED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
