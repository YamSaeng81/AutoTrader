spring:
  main:
    allow-bean-definition-overriding: true  # TestRedisConfig @Primary 빈이 RedisConfig를 덮어쓸 수 있도록

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # 🔴 운영의 `SET lock_timeout = '10s'`(2026-09-26 추가)를 여기서 지운다.
      #    H2 는 `SET LOCK_TIMEOUT <밀리초>` 형태만 받아 그 구문에서 커넥션 초기화가 실패한다.
      #    ⚠️ 따라서 **lock_timeout 의 실제 동작은 이 테스트 기반으로 검증되지 않는다.**
      #    Testcontainers 가 없어 H2(PostgreSQL 모드)로 도는데, 잠금 제한은 서버 설정이다.
      #    검증은 운영에서 의도적인 잠금 대기를 만들어 확인한다(사전 등록 문서 참조).
      connection-init-sql:
      leak-detection-threshold: 0

  jpa:
    hibernate:
      ddl-auto: none   # H2 초기화 SQL(schema-h2.sql)을 직접 사용
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

  flyway:
    enabled: false   # H2에서는 PostgreSQL 전용 DDL(hypertable 등) 실행 불가

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    serialization:
      write-dates-as-timestamps: false

api:
  auth:
    token: test-api-token  # 통합 테스트용 고정 토큰

server:
  port: 0  # 랜덤 포트 (테스트 격리)

logging:
  level:
    com.cryptoautotrader: WARN
    org.springframework.web: WARN
    org.springframework.test: WARN
