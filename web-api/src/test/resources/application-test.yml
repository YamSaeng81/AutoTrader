spring:
  main:
    allow-bean-definition-overriding: true  # TestRedisConfig @Primary 빈이 RedisConfig를 덮어쓸 수 있도록

  datasource:
    # 🔴 OPTIMIZE_REUSE_RESULTS=FALSE (2026-10-13) — H2 는 같은 질의를 반복하면 "테이블 변경 표시가 그대로면"
    #    이전 결과를 다시 돌려준다. 그 표시는 UPDATE 시점에 바뀌고 COMMIT 시점에는 바뀌지 않아, 다른 연결의
    #    UPDATE~COMMIT 사이에 한 번 읽은 연결은 **커밋된 값을 영영 못 본다**(다음 변경 전까지). 시험 10 에서
    #    재현: 복구의 커밋 후에도 폴러 쪽 반복 조회 54만 회가 10초간 옛 행(UNKNOWN/null)을 받았다. PostgreSQL
    #    에는 이런 결과 재사용이 없다 — 시험 기반만의 결함이므로 끈다.
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;OPTIMIZE_REUSE_RESULTS=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # 🔴 운영의 `SET lock_timeout = '10s'`(2026-09-26 추가)를 여기서 지운다.
      #    H2 는 `SET LOCK_TIMEOUT <밀리초>` 형태만 받아 그 구문에서 커넥션 초기화가 실패한다.
      #    ⚠️ 따라서 **lock_timeout 의 실제 동작은 이 테스트 기반으로 검증되지 않는다.**
      #    Testcontainers 가 없어 H2(PostgreSQL 모드)로 도는데, 잠금 제한은 서버 설정이다.
      #    검증은 운영에서 의도적인 잠금 대기를 만들어 확인한다(사전 등록 문서 참조).
      connection-init-sql:
      leak-detection-threshold: 0

  jpa:
    hibernate:
      ddl-auto: none   # H2 초기화 SQL(schema-h2.sql)을 직접 사용
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
    show-sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

  flyway:
    enabled: false   # H2에서는 PostgreSQL 전용 DDL(hypertable 등) 실행 불가

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    serialization:
      write-dates-as-timestamps: false

# 🔴 공유 풀 한도 (2026-10-12) — 운영에는 기본값이 없고 등록하지 않으면 실자금 진입·배정을 거절한다.
#    시험 기반은 "등록된 넉넉한 풀" 로 둔다. 한도 자체를 시험하는 클래스는 `CapitalPoolLimits` 를
#    직접 바꾸고 끝나면 되돌린다.
trading:
  single-instance:
    enabled: false
  capital-pool:
    stage: TEST
    total-cap-krw: 1000000000000
    per-position-cap-krw: 1000000000000
    max-concurrent-positions: 100000

# 🔴 일반 서비스 시험에서는 @Scheduled 작업을 끈다 (2026-10-13). 시험은 대상 메서드를 직접 부른다.
#    스케줄러 동작을 보는 시험만 `@ActiveProfiles("scheduler")` 로 켠다(application-scheduler.yml).
app:
  scheduling:
    enabled: false

api:
  auth:
    token: test-api-token  # 통합 테스트용 고정 토큰

server:
  port: 0  # 랜덤 포트 (테스트 격리)

logging:
  level:
    com.cryptoautotrader: WARN
    org.springframework.web: WARN
    org.springframework.test: WARN
