plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':core-engine')
    implementation project(':strategy-lib')
    implementation project(':exchange-adapter')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.postgresql:postgresql'

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Discord Bot (JDA)
    implementation 'net.dv8tion:JDA:5.2.1'

    // 모니터링: Spring Actuator + Micrometer Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
}

// ── 실제 프로세스 재시작 시험 전용 진입점 (2026-10-13) ─────────────────────────────
// 🔴 운영 jar(bootJar)에 들어가지 않는다 — 별도 소스 세트이고, 시험 구동기가 이 클래스패스로 앱을 직접 띄운다.
//    `./gradlew :web-api:restartHarnessClasspath` 가 클래스패스를 build/restart-harness-classpath.txt 에 쓴다.
sourceSets {
    restartHarness {
        java.srcDir 'src/restartHarness/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('restartHarnessClasspath') {
    dependsOn 'classes', 'restartHarnessClasses'
    def out = layout.buildDirectory.file('restart-harness-classpath.txt')
    outputs.file out
    doLast {
        out.get().asFile.text = sourceSets.restartHarness.runtimeClasspath.asPath
    }
}
