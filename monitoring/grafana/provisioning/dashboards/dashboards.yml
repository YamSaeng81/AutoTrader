# Grafana 대시보드 프로비저닝.
# 2026-09-15 신설 — 그전까지 데이터소스만 프로비저닝되고 대시보드는 컨테이너 볼륨
# 안에서 수기로 관리되고 있었다. grafana_data 볼륨을 잃으면 복구 불가능한 상태였다.
# 여기 있는 JSON 이 원본이며, UI 에서 고친 내용은 볼륨에만 남고 재기동 시 덮어써진다.
apiVersion: 1

providers:
  - name: 'crypto-auto-trader'
    orgId: 1
    folder: 'Crypto Auto Trader'
    type: file
    disableDeletion: false
    # UI 수정 후 저장을 허용하되, 원본은 어디까지나 이 저장소의 JSON 이다.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
